<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIA Compliance | TALOS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 700px;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 14px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: #1e293b;
            border: 1px solid #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .message {
            margin-top: 24px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <main class="page">
        <section class="card">

            <h1>SIA Compliance</h1>

            <div class="subtitle">
                TALOS Compliance Dashboard
            </div>

            <div class="status">
                Dashboard configuration in progress
            </div>

            <div class="message">
                Daily SIA compliance data will be displayed here once the
                automated C247 data feed has been connected.
            </div>

            <div class="footer">
                Securit Group Ltd.
            </div>

        </section>
    </main>

</body>
</html>
